<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-pulse {
        animation: pulseSlow 8s ease-in-out infinite alternate;
      }
      .wave-flow {
        animation: floatWave 12s linear infinite;
      }
      .bar-anim-1 { animation: growH 4s ease-in-out infinite alternate; transform-origin: bottom; }
      .bar-anim-2 { animation: growH 5s ease-in-out infinite alternate 0.5s; transform-origin: bottom; }
      .bar-anim-3 { animation: growH 3.5s ease-in-out infinite alternate 1s; transform-origin: bottom; }
      .bar-anim-4 { animation: growH 4.5s ease-in-out infinite alternate 1.5s; transform-origin: bottom; }
      .bar-anim-5 { animation: growH 5.5s ease-in-out infinite alternate 0.8s; transform-origin: bottom; }
      
      .bubble-1 { animation: floatSlow 7s ease-in-out infinite alternate; }
      .bubble-2 { animation: floatSlow 9s ease-in-out infinite alternate-reverse; }
      .bubble-3 { animation: floatSlow 6s ease-in-out infinite alternate 1s; }

      .pulse-ring {
        animation: ripple 3s cubic-bezier(0.1, 0.7, 0.4, 1) infinite;
        transform-origin: 1040px 140px;
      }

      @keyframes pulseSlow {
        0% { opacity: 0.3; transform: scale(1); }
        100% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatWave {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes growH {
        0% { transform: scaleY(0.6); }
        100% { transform: scaleY(1.15); }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-16px) rotate(3deg); }
      }
      @keyframes ripple {
        0% { r: 12px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 42px; opacity: 0; stroke-width: 0.5px; }
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#techGrid)" rx="16" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Placed strictly behind text & on the right/bottom) -->
  <g class="bg-pulse" opacity="0.4">
    <circle cx="1000" cy="120" r="160" fill="#6366f1" filter="url(#softGlow)" />
    <circle cx="200" cy="360" r="130" fill="#0ea5e9" filter="url(#softGlow)" />
    <circle cx="700" cy="300" r="140" fill="#a855f7" filter="url(#softGlow)" />
  </g>

  <!-- Flowing Wave Graphic in Background -->
  <g class="wave-flow" opacity="0.25">
    <path d="M 0 350 C 300 280, 500 400, 800 320 C 1000 260, 1150 340, 1300 310 L 1300 420 L 0 420 Z" fill="url(#glowGrad)" />
  </g>

  <!-- Dynamic UI Mockup / Metrics Graphic Card (Right Side, completely separated from title) -->
  <g class="bubble-1" transform="translate(760, 50)">
    <!-- Engagement Analytics Glass Card -->
    <rect x="0" y="0" width="380" height="230" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="22" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="22" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="54" cy="22" r="5" fill="#22c55e" opacity="0.8" />
    <text x="75" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">eNPS &amp; Sentiment Stream</text>
    
    <!-- eNPS Live Badge -->
    <rect x="270" y="14" width="92" height="22" rx="6" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
    <circle cx="282" cy="25" r="4" fill="#22c55e" />
    <text x="292" y="26" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="700">eNPS +68</text>

    <!-- Animated Data Chart Bars -->
    <g transform="translate(30, 185)">
      <!-- Axis line -->
      <line x1="0" y1="0" x2="320" y2="0" stroke="#475569" stroke-width="1" />
      
      <!-- Bar 1 -->
      <rect class="bar-anim-1" x="20" y="-85" width="28" height="85" rx="5" fill="#38bdf8" />
      <!-- Bar 2 -->
      <rect class="bar-anim-2" x="75" y="-120" width="28" height="120" rx="5" fill="#6366f1" />
      <!-- Bar 3 -->
      <rect class="bar-anim-3" x="130" y="-65" width="28" height="65" rx="5" fill="#818cf8" />
      <!-- Bar 4 -->
      <rect class="bar-anim-4" x="185" y="-140" width="28" height="140" rx="5" fill="#a855f7" />
      <!-- Bar 5 -->
      <rect class="bar-anim-5" x="240" y="-105" width="28" height="105" rx="5" fill="#ec4899" />
    </g>

    <text x="35" y="206" fill="#64748b" font-family="sans-serif" font-size="10">Surveys</text>
    <text x="92" y="206" fill="#64748b" font-family="sans-serif" font-size="10">Pulse</text>
    <text x="145" y="206" fill="#64748b" font-family="sans-serif" font-size="10">Feedback</text>
    <text x="202" y="206" fill="#64748b" font-family="sans-serif" font-size="10">Kudos</text>
    <text x="256" y="206" fill="#64748b" font-family="sans-serif" font-size="10">Culture</text>
  </g>

  <!-- Secondary Dynamic Element: Micro Pulse Card -->
  <g class="bubble-2" transform="translate(850, 260)">
    <rect x="0" y="0" width="280" height="78" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="35" cy="39" r="18" fill="#3b82f6" fill-opacity="0.2" />
    <text x="27" y="46" fill="#60a5fa" font-family="sans-serif" font-size="20">⚡</text>
    <text x="65" y="32" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Real-Time Pulse Sentiment</text>
    <text x="65" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">94.8% Response Rate across 2.4k staff</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Ensured 100% visible, high-contrast, unaffected by background graphics) -->
  <g transform="translate(65, 0)">
    
    <!-- Category Badge -->
    <g transform="translate(0, 56)">
      <rect width="270" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="30" y="20" fill="#a5b4fc" class="badge-text">HR TECH &amp; PEOPLE ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" class="title-text">
      Awesome Employee
    </text>
    <text x="0" y="194" fill="url(#accentGrad)" class="title-text">
      Engagement Platforms
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="245" fill="#e2e8f0" class="subtitle-text">
      Curated landscape of Enterprise SaaS suites and Open-Source software
    </text>
    <text x="0" y="275" fill="#94a3b8" class="subtitle-text" font-size="16">
      Pulse surveys, anonymous feedback loops, eNPS metrics &amp; recognition ecosystems.
    </text>

    <!-- Key Ecosystem Badges (Pills) -->
    <g transform="translate(0, 318)">
      <!-- Pill 1 -->
      <g>
        <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="23" fill="#38bdf8" class="badge-text">📊 Pulse Surveys</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" fill="#818cf8" class="badge-text">🔒 Anonymous Voice</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(320, 0)">
        <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" fill="#c084fc" class="badge-text">🏆 Peer Recognition</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(475, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" fill="#34d399" class="badge-text">📈 People Analytics</text>
      </g>
    </g>

  </g>
</svg>
